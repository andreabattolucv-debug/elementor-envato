<!-- ══════════════════════════════════════════
     GLOBALS + HEADER  (globals merged here — no separate widget needed)
══════════════════════════════════════════ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ════════════════════════════════════════
     FULL-BLEED: break out of every Elementor
     and Astra container
  ════════════════════════════════════════ */

  /* 1. The Elementor widget itself */
  .elementor-widget-html,
  .elementor-widget-html .elementor-widget-container {
    padding: 0 !important;
    margin: 0 !important;
    max-width: none !important;
    width: 100vw !important;
    position: relative !important;
    left: 50% !important;
    right: 50% !important;
    margin-left: -50vw !important;
    margin-right: -50vw !important;
  }

  /* 2. Elementor section & column containers */
  .elementor-section.elementor-section-boxed > .elementor-container,
  .elementor-column-wrap,
  .elementor-widget-wrap,
  .e-con-inner,
  .e-con {
    max-width: 100% !important;
    padding: 0 !important;
    width: 100% !important;
  }

  /* 3. Astra theme global containers */
  .ast-container,
  .ast-flex,
  .site-content,
  #content,
  #primary,
  .entry-content,
  .post-content,
  main.site-main,
  .elementor-page .elementor {
    max-width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
    width: 100% !important;
  }

  /* 4. Hide Astra native header + reset any body padding it adds */
  body.elementor-page,
  body.elementor-page .site-header,
  body.elementor-page #masthead,
  body.elementor-page .ast-site-header-wrap,
  body.elementor-page .main-header-bar-wrap,
  body.elementor-page .ast-above-header-wrap,
  body.elementor-page .ast-below-header-wrap {
    padding-top: 0 !important;
    margin-top: 0 !important;
  }
  body.elementor-page #masthead,
  body.elementor-page .site-header,
  body.elementor-page .ast-site-header-wrap {
    display: none !important;
  }

  /* Suppress every other header source — Theme Builder, ekit-nav-menu toggle */
  .elementor-location-header,
  [data-elementor-type="header"],
  .elementskit-menu-toggle,
  .elementskit-menu-hamburger {
    display: none !important;
    pointer-events: none !important;
  }

  /* 5. Anchor scroll offset: compensate for our 80px fixed header */
  [id] { scroll-margin-top: 88px; }

  /* 6. Prevent Astra from overriding our heading styles */
  .ohh-hero h1, .ohh-why-left h2, .ohh-exp-header h2,
  .ohh-dest-header h2, .ohh-how-header h2, .ohh-testi-header h2,
  .ohh-contact-left h2, .ohh-how-step h4, .ohh-why-card h4,
  .ohh-exp-card h3, .ohh-dest-name {
    margin-top: 0 !important;
    padding: 0 !important;
    font-weight: inherit !important;
  }

  html { scroll-behavior: smooth; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  img { max-width: 100%; display: block; }
  a { text-decoration: none; }
  ul { list-style: none; }
  :root {
    --dark:       #12100E;
    --cream:      #FAF7F2;
    --terracotta: #DAA520;
    --gold:       #DAA520;
    --sage:       #7A8C78;
    --white:      #FFFFFF;
    --text:       #2C2825;
    --text-muted: #7A7067;
    --border:     rgba(44,40,37,0.12);
    --btn-primary-bg: #DAA520;
  }
  .section-label {
    font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 600; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--terracotta);
    margin-bottom: 14px; display: block;
  }
  .section-label--light { color: var(--gold); }
  h1,h2,h3,h4 { font-family: 'Cormorant Garamond', serif; }
  .btn-primary {
    display: inline-block; padding: 14px 36px;
    background: var(--btn-primary-bg); color: var(--dark);
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    border: 2px solid var(--btn-primary-bg); transition: background .3s, color .3s; cursor: pointer;
  }
  .btn-primary:hover { background: transparent; color: var(--btn-primary-bg); }
  .btn-outline {
    display: inline-block; padding: 13px 34px; background: transparent;
    color: var(--white); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    border: 2px solid rgba(255,255,255,0.55); transition: border-color .3s, background .3s;
  }
  .btn-outline:hover { border-color: #fff; background: rgba(255,255,255,0.1); color: #fff !important; }
</style>

<style>
.ohh-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 9999;
  transition: background .4s, box-shadow .4s;
  padding: 0 5%;
}
.ohh-header.scrolled {
  background: var(--dark);
  box-shadow: 0 2px 24px rgba(0,0,0,0.28);
}
.ohh-navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 80px;
}
.ohh-logo img {
  height: 48px;
  width: auto;
  display: block;
  object-fit: contain;
}

.ohh-nav {
  display: flex;
  align-items: center;
  gap: 36px;
}
.ohh-nav a {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.82);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  transition: color .2s;
  white-space: nowrap;
}
.ohh-nav a:hover { color: var(--gold); }

.ohh-header-cta {
  display: inline-block;
  padding: 10px 26px;
  background: var(--btn-primary-bg);
  color: var(--dark);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 2px solid var(--btn-primary-bg);
  transition: background .3s, color .3s;
  white-space: nowrap;
}
.ohh-header-cta:hover { background: transparent; color: var(--btn-primary-bg); }

@media (max-width: 900px) {
  .ohh-nav { display: none; }
  .ohh-header-cta {
    padding: 9px 18px;
    font-size: 11px;
  }
}
</style>

<header class="ohh-header" id="ohhHeader">
  <nav class="ohh-navbar">
    <a href="#hero" class="ohh-logo">
      <img src="https://ohhitaly.com/wp-content/uploads/2019/11/logo-ohh-italy-white-180x75.png"
           alt="OHH! Italy — Luxury Italian Travel">
    </a>

    <ul class="ohh-nav" id="ohhNav">
      <li><a href="#experiences">Experiences</a></li>
      <li><a href="#destinations">Destinations</a></li>
      <li><a href="#why-us">About Us</a></li>
      <li><a href="#testimonials">Reviews</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>

    <a href="#contact" class="ohh-header-cta">Plan My Trip</a>
  </nav>
</header>

<script>
(function(){
  function mountHeader() {
    // Deduplicate: Elementor editor may render the widget twice
    var all = document.querySelectorAll('[id="ohhHeader"]');
    for (var i = 1; i < all.length; i++) {
      all[i].parentNode && all[i].parentNode.removeChild(all[i]);
    }

    var h = document.getElementById('ohhHeader');
    if (!h) return;
    // Move our header to body root so position:fixed works and it escapes
    // any Elementor/Astra container (including the Theme Builder header)
    if (h.parentNode !== document.body) {
      document.body.insertBefore(h, document.body.firstChild);
    }

    // Scroll: transparent → dark
    function onScroll() { h.classList.toggle('scrolled', window.scrollY > 60); }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  function killForeignHeaders() {
    // Hide every header source that isn't ours:
    // Astra native, Elementor Theme Builder header (any selector variant),
    // and any ekit-nav-menu mobile toggle still in the DOM.
    var css = [
      '#masthead,',
      '.site-header,',
      '.ast-site-header-wrap,',
      '.main-header-bar-wrap,',
      '.ast-above-header-wrap,',
      '.ast-below-header-wrap,',
      '.elementor-location-header,',
      '[data-elementor-type="header"],',
      '.elementskit-menu-toggle,',
      '.elementskit-menu-hamburger {',
      '  display:none!important;',
      '  height:0!important;',
      '  min-height:0!important;',
      '  overflow:hidden!important;',
      '  pointer-events:none!important;',
      '}',
      'html,body,.elementor-page{padding-top:0!important;margin-top:0!important;}'
    ].join('');

    var style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);

    // Also force-hide via inline style (overrides Elementor's own !important rules)
    var jsSelectors = [
      '#masthead', '.site-header', '.ast-site-header-wrap',
      '.main-header-bar-wrap', '.ast-above-header-wrap', '.ast-below-header-wrap',
      '.elementor-location-header', '[data-elementor-type="header"]',
      '.elementskit-menu-toggle', '.elementskit-menu-hamburger'
    ];
    jsSelectors.forEach(function(sel) {
      document.querySelectorAll(sel).forEach(function(el) {
        // Don't hide our own header if it happens to match
        if (el.id !== 'ohhHeader' && !el.contains(document.getElementById('ohhHeader'))) {
          el.style.cssText = 'display:none!important;height:0!important;';
        }
      });
    });

    document.body.style.paddingTop = '0';
    document.documentElement.style.paddingTop = '0';
  }

  function init() {
    // Mount our header first (moves it out of any Elementor container),
    // then kill everything else — order matters.
    mountHeader();
    killForeignHeaders();
  }

  if (document.head) {
    init();
  } else {
    document.addEventListener('DOMContentLoaded', init);
  }
})();
</script>
