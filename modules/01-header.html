<style>
  :root {
    --dark:       #12100E;
    --cream:      #FAF7F2;
    --terracotta: #C4622D;
    --gold:       #C9A257;
    --sage:       #7A8C78;
    --white:      #FFFFFF;
    --text:       #2C2825;
    --text-muted: #7A7067;
    --border:     rgba(44,40,37,0.12);
  }
  *, *::before, *::after { box-sizing: border-box; }
  img { max-width: 100%; display: block; }
  a { text-decoration: none; }
  ul { list-style: none; }
  .section-label {
    font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 600; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--terracotta);
    margin-bottom: 14px; display: block;
  }
  .section-label--light { color: var(--gold); }
  h1,h2,h3,h4 { font-family: 'Cormorant Garamond', serif; }
  .btn-primary {
    display: inline-block; padding: 14px 36px;
    background: #ffd92f; color: var(--dark);
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    border: 2px solid #ffd92f; transition: background .3s, color .3s; cursor: pointer;
  }
  .btn-primary:hover { background: transparent; color: #ffd92f; }
  .btn-outline {
    display: inline-block; padding: 13px 34px; background: transparent;
    color: var(--white); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    border: 2px solid rgba(255,255,255,0.55); transition: border-color .3s, background .3s;
  }
  .btn-outline:hover { border-color: #fff; background: rgba(255,255,255,0.1); }
</style>

<style>
.ohh-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 9999;
  transition: background .4s, box-shadow .4s;
  padding: 0 5%;
}
.ohh-header.scrolled {
  background: var(--dark);
  box-shadow: 0 2px 24px rgba(0,0,0,0.28);
}
.ohh-navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 80px;
}
.ohh-logo img {
  height: 48px;
  width: auto;
  display: block;
  object-fit: contain;
}

.ohh-nav {
  display: flex;
  align-items: center;
  gap: 36px;
}
.ohh-nav a {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.82);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  transition: color .2s;
  white-space: nowrap;
}
.ohh-nav a:hover { color: var(--gold); }

.ohh-header-cta {
  display: inline-block;
  padding: 10px 26px;
  background: #ffd92f;
  color: var(--dark);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 2px solid #ffd92f;
  transition: background .3s, color .3s;
  white-space: nowrap;
}
.ohh-header-cta:hover { background: transparent; color: #ffd92f; }

.ohh-hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  padding: 4px;
}
.ohh-hamburger span {
  display: block;
  width: 24px;
  height: 1.5px;
  background: #fff;
  transition: transform .3s, opacity .3s;
}

.ohh-mobile-menu {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--dark);
  z-index: 9998;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
}
.ohh-mobile-menu.open { display: flex; }
.ohh-mobile-menu a {
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 500;
  color: rgba(255,255,255,0.82);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.ohh-mobile-menu .ohh-mobile-close {
  position: absolute;
  top: 28px; right: 5%;
  font-size: 28px;
  color: #fff;
  cursor: pointer;
  line-height: 1;
}

@media (max-width: 900px) {
  .ohh-nav { display: none; }
  .ohh-header-cta { display: none; }
  .ohh-hamburger { display: flex; }
}
</style>

<!-- ══════════════════════════════════════════
     HEADER — fixed nav + mobile menu
══════════════════════════════════════════ -->
<header class="ohh-header" id="ohh-header">
  <nav class="ohh-navbar">
    <a href="#hero" class="ohh-logo">
      <img src="https://ohhitaly.com/wp-content/uploads/2019/11/logo-ohh-italy-white-180x75.png" alt="OHH! Italy">
    </a>
    <div class="ohh-nav">
      <a href="#experiences">Experiences</a>
      <a href="#destinations">Destinations</a>
      <a href="#about">About Us</a>
      <a href="#testimonials">Reviews</a>
      <a href="#contact">Contact</a>
    </div>
    <a href="#contact" class="ohh-header-cta">Plan My Trip</a>
    <div class="ohh-hamburger" id="ohh-hamburger">
      <span></span><span></span><span></span>
    </div>
  </nav>
</header>

<div class="ohh-mobile-menu" id="ohh-mobile-menu">
  <span class="ohh-mobile-close" id="ohh-mobile-close">&times;</span>
  <a href="#experiences" onclick="closeMobileMenu()">Experiences</a>
  <a href="#destinations" onclick="closeMobileMenu()">Destinations</a>
  <a href="#about" onclick="closeMobileMenu()">About Us</a>
  <a href="#testimonials" onclick="closeMobileMenu()">Reviews</a>
  <a href="#contact" onclick="closeMobileMenu()">Contact</a>
  <a href="#contact" class="btn-primary" onclick="closeMobileMenu()">Plan My Trip</a>
</div>

<script>
(function(){
  var header = document.getElementById('ohh-header');
  var hamburger = document.getElementById('ohh-hamburger');
  var mobileMenu = document.getElementById('ohh-mobile-menu');
  var closeBtn = document.getElementById('ohh-mobile-close');

  window.addEventListener('scroll', function(){
    if(window.scrollY > 40) header.classList.add('scrolled');
    else header.classList.remove('scrolled');
  });

  hamburger.addEventListener('click', function(){
    mobileMenu.classList.add('open');
  });

  closeBtn.addEventListener('click', function(){
    mobileMenu.classList.remove('open');
  });

  window.closeMobileMenu = function(){
    mobileMenu.classList.remove('open');
  };
})();
</script>
