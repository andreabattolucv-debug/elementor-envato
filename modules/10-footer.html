<style>
:root{--dark:#12100E;--cream:#FAF7F2;--terracotta:#DAA520;--gold:#DAA520;--sage:#7A8C78;--white:#FFFFFF;--text:#2C2825;--text-muted:#7A7067;--border:rgba(44,40,37,0.12);--btn-primary-bg:#DAA520;}
*,*::before,*::after{box-sizing:border-box;}img{max-width:100%;display:block;}a{text-decoration:none;}ul{list-style:none;}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;}
.elementor-widget-html,.elementor-widget-html .elementor-widget-container{padding:0!important;margin:0!important;max-width:none!important;width:100vw!important;position:relative!important;left:50%!important;right:50%!important;margin-left:-50vw!important;margin-right:-50vw!important;}
.elementor-section.elementor-section-boxed>.elementor-container,.elementor-column-wrap,.elementor-widget-wrap,.e-con-inner,.e-con{max-width:100%!important;padding:0!important;width:100%!important;}
.ast-container,.ast-flex,.site-content,#content,#primary,.entry-content,.post-content,main.site-main,.elementor-page .elementor{max-width:100%!important;padding:0!important;margin:0!important;width:100%!important;}
body.elementor-page{padding-top:0!important;}
.section-label{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--terracotta);margin-bottom:14px;display:block;}
.section-label--light{color:var(--gold);}
.btn-primary{display:inline-block;padding:14px 36px;background:var(--btn-primary-bg);color:var(--dark);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;border:2px solid var(--btn-primary-bg);transition:background .3s,color .3s;cursor:pointer;}
.btn-primary:hover{background:transparent;color:var(--btn-primary-bg);}
.btn-outline{display:inline-block;padding:13px 34px;background:transparent;color:var(--white);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;border:2px solid rgba(255,255,255,0.55);transition:border-color .3s,background .3s;}
.btn-outline:hover{border-color:#fff;background:rgba(255,255,255,0.1);color:#fff!important;}
</style>

<style>
.ohh-footer {
  background: #0C0A08;

.ohh-footer-bottom {

  align-items: center;
  justify-content: space-between;
  padding: 24px 0;
  flex-wrap: wrap;

.ohh-footer-legal { display: flex; gap: 24px; }
.ohh-footer-legal a { font-size: 13px; color: rgba(255,255,255,.25); font-family: 'Inter', sans-serif; text-decoration: none; transition: color .2s; }
.ohh-footer-legal a:hover { color: rgba(255,255,255,.6); }
